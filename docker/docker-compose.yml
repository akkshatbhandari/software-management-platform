# Copy docker/.env.example to docker/.env and set secrets before first run.
version: "3.9"

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-sms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
      POSTGRES_DB: ${DB_NAME:-sms_db}
    ports:
      - "5432:5432"
  
  redis:
    image: redis:7
    ports: 
      - "6379:6379"
  
  core-go:
    build: ../services/core-go
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-sms_user}
      DB_PASSWORD: ${DB_PASSWORD:-strongpassword}
      DB_NAME: ${DB_NAME:-sms_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      PORT: "3000"
    depends_on:
      - postgres

  gateway-node:
    build: ../services/gateway-node
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
      CORE_GO_BASE_URL: http://core-go:3000
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
    depends_on:
      - core-go
      - redis
  
  worker:
   build: ../services/worker
   depends_on:
    - redis
  
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000" 